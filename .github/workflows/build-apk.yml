name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses and Install Components
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

      - name: Build APK with Gradle
        working-directory: ./app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "Build failed! Extracting cause..."
            grep -B 2 -A 40 "What went wrong" /tmp/build.log > /tmp/error.txt || tail -n 80 /tmp/build.log > /tmp/error.txt
            exit 1
          }

      - name: Post Failure Error Report
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: 编译错误报告
          body_path: /tmp/error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          echo "=== All generated APK files ==="
          find . -name "*.apk" -type f
          APK_FILE=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            tail -n 100 /tmp/build.log
            tail -n 100 /tmp/build.log > /tmp/error.txt
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" release-apk/RealtimeDebate.apk
          ls -lh release-apk/RealtimeDebate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeDebate-Android-APK
          path: release-apk/RealtimeDebate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.3
          name: RealtimeDebate 安卓版 v1.0.3 (同步提示词字数硬约束与对话收敛机制)
          body: |
            🎉 **Realtime AI 对辩助手（安卓原生版 v1.0.3）更新！**

            ### 🛠️ 本次更新：
            - **字数硬约束与时长精准控制**：
              - **十万个为什么**：严格控制在 30 字以内，生动比喻通俗解释身边的自然科学秘密（Tina）。
              - **苏格拉底**：严格控制在 30 字以内，聚焦核心漏洞反问；学生论证自洽时停止追问并做一句终结（Ethan）。
              - **反方辩友**：严格控制在 50 字以内；若论据严密坦诚承认局部合理性，共识达成后宣告辩论结束（Ethan）。
              - **研讨伙伴**：严格控制在 50 字以内；机制推导基本完善时简短概括核心结论友好结束研讨（Tina）。
              - **一年级助教**：严格控制在 45 字以内；引导思考，答对后表扬并宣布通关结束，不再反复纠缠（Tina）。
            - **纯净指令下发**：移除一切模板化套话，直接通过角色规则与字数上限约束，避免模型出现冗余废话。
            - **自定义角色升级**：默认提示词为「请输入提示词界定角色」，默认期望时长设定为 12 秒，自动换算字数控制。

            ### 🚀 安装与使用：
            1. 点击下方 `RealtimeDebate.apk` 直接下载到手机；
            2. 安装覆盖原版本；
            3. 开启连麦通话，体验更紧凑、更精准、能收敛结束的全新对辩！
          files: release-apk/RealtimeDebate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
