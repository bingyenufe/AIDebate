name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        working-directory: ./app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle :app:assembleRelease :app:assembleDebug --stacktrace --info 2>&1 | tee ../build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find app/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-apk/RealtimeDebate.apk
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeDebate-Android-APK
          path: release-apk/RealtimeDebate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: RealtimeDebate 安卓版 v1.0.0
          body: |
            🎉 **Realtime AI 对辩助手（安卓原生版）发布！**

            ### 🚀 傻瓜式安装说明：
            1. 在安卓手机浏览器中点击下方 `RealtimeDebate.apk` 下载；
            2. 下载完成后点击安装（如提示未知应用来源，选择允许安装）；
            3. 首次打开在右上角填写您的阿里云 DashScope API Key（仅需填写一次，保存在手机本地）；
            4. 点击「开启实时连麦通话」，即刻享受毫秒级全双工对辩！

            ### ✨ 核心特性：
            - 直连阿里云千问 `qwen3.5-omni-flash-realtime` 实时模型，零服务器中转。
            - 包含苏格拉底、反方辩友、研讨伙伴、一年级学习助手、十万个为什么。
            - **自定义角色**：单行独立窗口自由输入单次回答时长（秒）。
          files: release-apk/RealtimeDebate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
