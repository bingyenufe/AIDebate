name: Build Android APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd app
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Find and Rename APK
        run: |
          mkdir -p release-apk
          find app/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apk/RealtimeDebate.apk \;
          ls -lh release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeDebate-Android-APK
          path: release-apk/RealtimeDebate.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: app-v1.0
          name: RealtimeDebate 安卓版 v1.0
          body: |
            🎉 **Realtime AI 对辩助手（安卓原生版）发布！**

            ### 🚀 傻瓜式安装说明：
            1. 在安卓手机浏览器中点击下方 `RealtimeDebate.apk` 下载；
            2. 下载完成后点击安装（如提示未知应用来源，选择允许安装）；
            3. 首次打开在右上角填写您的阿里云 DashScope API Key（仅需填写一次，保存在手机本地）；
            4. 点击「开启实时连麦通话」，即刻享受毫秒级全双工对辩！

            ### ✨ 核心特性：
            - 直连阿里云千问 `qwen3.5-omni-flash-realtime` 实时模型，零服务器中转。
            - 包含苏格拉底、反方辩友、研讨伙伴、一年级学习助手、十万个为什么。
            - **自定义角色**：专属 `约【 】秒` 窗口自由输入单次回答时长。
          files: release-apk/RealtimeDebate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
