name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses and Install Components
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

      - name: Build APK with Gradle
        working-directory: ./app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "Build failed! Extracting cause..."
            grep -B 2 -A 40 "What went wrong" /tmp/build.log > /tmp/error.txt || tail -n 80 /tmp/build.log > /tmp/error.txt
            exit 1
          }

      - name: Post Failure Error Report
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: 编译错误报告
          body_path: /tmp/error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          echo "=== All generated APK files ==="
          find . -name "*.apk" -type f
          APK_FILE=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            tail -n 100 /tmp/build.log
            tail -n 100 /tmp/build.log > /tmp/error.txt
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" release-apk/RealtimeDebate.apk
          ls -lh release-apk/RealtimeDebate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeDebate-Android-APK
          path: release-apk/RealtimeDebate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.5
          name: RealtimeDebate 安卓版 v1.0.5 (彻底解决初次说话跳出与AI音量过小问题)
          body: |
            🎉 **Realtime AI 对辩助手（安卓原生版 v1.0.5）重要体验更新！**

            ### 🛠️ 本次核心修复：
            - **彻底解决初次说话跳出 App 中止对话问题**：
              - **彻底移除 `moveTaskToBack`**：通话与连麦过程中全面拦截返回键与侧滑手势，页面牢牢锁定在前台，怎么误碰边缘都不会跳出 App，只有点击界面红色「🛑 挂断通话」才允许结束。
              - **全阶段防误触**：从点击开启通话第 0 秒起即进入保护；未通话时滑选角色卡片也增加「双击返回才退出」保护，彻底消除滑动手势误退。
              - **贴脸息屏防误触**：加入距离传感器，把手机贴近耳朵听讲或说话时自动黑屏防误触，拿开手机自动亮屏。
              - **消除首次说话底层音频隐患**：优化打断逻辑，仅在 AI 实际发声时才触发音频重置，避免空打断引发硬件底层异常。
            - **彻底解决 AI 说话音量过小（户外听不清）问题**：
              - **Bilibili 同款媒体大功率声道**：从通话听筒流切换至媒体主扬声器通道（`USAGE_MEDIA` / `STREAM_MUSIC`），通过手机底部大功率外放喇叭播放。
              - **PCM 1.8x 数字音频增益算法**：对百炼大模型的原始语音进行 1.8 倍线性增益放大，并自带饱和限幅防爆音保护，在户外嘈杂环境下也能清晰宏亮播放。

            ### 🚀 安装与使用：
            1. 点击下方 `RealtimeDebate.apk` 直接下载到手机；
            2. 安装覆盖原版本；
            3. 点击「开启实时连麦通话」，即刻体验宏亮声音与绝不跳出的稳定对辩！
          files: release-apk/RealtimeDebate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
