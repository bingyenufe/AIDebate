name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses and Install Components
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

      - name: Build APK with Gradle
        working-directory: ./app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "Build failed! Extracting cause..."
            grep -B 2 -A 40 "What went wrong" /tmp/build.log > /tmp/error.txt || tail -n 80 /tmp/build.log > /tmp/error.txt
            exit 1
          }

      - name: Post Failure Error Report
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: 编译错误报告
          body_path: /tmp/error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          echo "=== All generated APK files ==="
          find . -name "*.apk" -type f
          APK_FILE=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            tail -n 100 /tmp/build.log
            tail -n 100 /tmp/build.log > /tmp/error.txt
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" release-apk/RealtimeDebate.apk
          ls -lh release-apk/RealtimeDebate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeDebate-Android-APK
          path: release-apk/RealtimeDebate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.6
          name: RealtimeDebate 安卓版 v1.0.6 (彻底修复点击屏幕退出与中断对话问题)
          body: |
            🎉 **Realtime AI 对辩助手（安卓原生版 v1.0.6）修复更新！**

            ### 🛠️ 本次核心修复：
            - **彻底解决点击屏幕直接退出并中止对话的问题**：
              - **彻底移除距离传感器息屏锁（Proximity WakeLock）**：消除了手部靠近屏幕点击时触发的黑屏以及 Android 系统输入通道（InputDispatcher）在息屏时的致命闪退冲突。现在即使手掌靠近屏幕、点击屏幕中间任何地方，都不会黑屏，更不会跳出程序！
              - **底层音频线程互斥锁保护（trackLock）**：手指触碰屏幕的轻微震动杂音触发 VAD 打断时，音频播放停止与写入受到完全的互斥锁保护，彻底杜绝底层 C++ 音频驱动（SIGSEGV）并发闪退。
              - **AI 说话 UI 刷新状态节流**：消除每秒数十次音频流帧刷爆主线程 Looper 的现象，保障触控响应的极端平稳。
              - **通话中锁定设置按钮**：进入通话后右上角设置按钮同步锁定置灰，避免误触弹出对话框。
              - **全局崩溃兜底保护**：加入未捕获异常全局拦截，确保即使有任何意外 UI 异常也绝不闪退回到桌面。

            ### 🚀 安装与使用：
            1. 点击下方 `RealtimeDebate.apk` 直接下载到手机；
            2. 安装覆盖原版本；
            3. 点击「开启实时连麦通话」，即刻享受随时触摸屏幕也不会退出的稳定对辩！
          files: release-apk/RealtimeDebate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
