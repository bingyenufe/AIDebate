name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses and Install Components
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

      - name: Build APK with Gradle
        working-directory: ./app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "Build failed! Extracting cause..."
            grep -B 2 -A 40 "What went wrong" /tmp/build.log > /tmp/error.txt || tail -n 80 /tmp/build.log > /tmp/error.txt
            exit 1
          }

      - name: Post Failure Error Report
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: 编译错误报告
          body_path: /tmp/error.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          echo "=== All generated APK files ==="
          find . -name "*.apk" -type f
          APK_FILE=$(find . -name "*release*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            tail -n 100 /tmp/build.log
            tail -n 100 /tmp/build.log > /tmp/error.txt
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" release-apk/RealtimeDebate.apk
          ls -lh release-apk/RealtimeDebate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeDebate-Android-APK
          path: release-apk/RealtimeDebate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: RealtimeDebate 安卓版 v1.1.0 (新增拍照与图片上传，支持看图语音辅导)
          body: |
            🎉 **Realtime AI 对辩助手（安卓原生版 v1.1.0）多模态重大升级！**

            ### 🌟 本次核心新特性：
            - **全新视觉多模态支持：新增拍照与图片上传功能**：
              - **双入口选择**：界面点击「📷 拍照 / 选图」，可选择直接调起相机拍摄试卷/题目，或从手机相册选取图片。
              - **边看图边语音交流**：上传图片后，图片自动保留在界面上，用户直接对麦克风提问，AI 结合画面内容与题面信息进行实时语音解答。
              - **多轮看图追问与灵活移除**：同一张题目图可连续追问多轮无需重传；讲完后点击【✖ 移除】即可一键释放视觉上下文回到纯语音交流，避免多余 Token 消耗。
              - **毫秒级本地高清压缩**：手机拍照原生 5~15MB 大图自动在本地等比缩放到 1280px，生成 200KB 高清图，字迹公式清晰，毫秒级传输不卡顿。
              - **零权限安全架构**：基于 Android 官方 PhotoPicker 与 FileProvider 安全契约，无需申请敏感的存储权限。
            - **全面继承 v1.0.6 的稳定性**：
              - 触屏防崩溃、双击返回退出防误触、户外大音量增强全量保留。

            ### 🚀 安装与使用：
            1. 点击下方 `RealtimeDebate.apk` 直接下载到手机；
            2. 安装覆盖原版本；
            3. 点击「📷 拍照 / 选图」拍下作业题或实物，开启通话，即可体验真人级“边看图边语音辅导”！
          files: release-apk/RealtimeDebate.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
